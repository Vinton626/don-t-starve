<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能树</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 20px 40px;
    color: #e6d7b8;
    font-family: Palatino, "Palatino Linotype", "Songti SC", "STSong", "Noto Serif SC", serif;
    background-color: #0c0907;
    background-image:
      radial-gradient(ellipse at center, rgba(12,8,6,.28) 0%, rgba(6,4,3,.72) 72%, rgba(0,0,0,.88) 100%),
      linear-gradient(rgba(8,6,4,.5), rgba(8,6,4,.62)),
      url("img/Pc_background.jpg");
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .app {
    width: 600px;
    max-width: 100%;
    background: rgba(16, 11, 8, .84);
    border: 1px solid #a6843f;
    border-radius: 2px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px #2a1c10,
      0 22px 50px rgba(0,0,0,.72),
      inset 0 0 80px rgba(0,0,0,.35);
  }
  svg { display: block; width: 100%; height: auto; }
  text { user-select: none; pointer-events: none; }
  .group-title-hit { cursor: default; }
  .group-title-hit.has-note { cursor: help; }
  .group-title.has-note { text-decoration: underline dotted #8a7030; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(8, 6, 4, .55);
    border-bottom: 1px solid #6e5428;
    font-size: 14px;
    color: #cbb892;
  }
  .toolbar select,
  .char-picker-btn {
    background: rgba(28, 20, 12, .9);
    color: #f0e2c0;
    border: 1px solid #8a6a32;
    border-radius: 2px;
    padding: 5px 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .char-picker { position: relative; }
  .char-picker-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 7.5em;
    cursor: pointer;
  }
  .char-picker-menu {
    position: absolute;
    z-index: 15;
    top: calc(100% + 4px);
    left: 0;
    min-width: 100%;
    padding: 4px 0;
    background: rgba(22, 16, 10, .98);
    border: 1px solid #8a6a32;
    border-radius: 2px;
    box-shadow: 0 10px 24px rgba(0,0,0,.45);
  }
  .char-option {
    display: block;
    width: 100%;
    padding: 6px 10px;
    background: transparent;
    border: 0;
    color: #f0e2c0;
    font: inherit;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .char-option:hover,
  .char-option.current { color: #f0d060; background: #3a3418; }
  .char-option.is-locked,
  .char-option.is-locked:hover {
    color: #6d5c48;
    background: transparent;
    cursor: default;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px;
    background: rgba(8, 6, 4, .55);
    border-top: 1px solid #6e5428;
    font-size: 14px;
    color: #cbb892;
    letter-spacing: 1px;
  }
  .status-bar .points { color: #f0d060; font-weight: bold; }

  .desc-panel {
    display: flex;
    flex-direction: column;
    min-height: 280px;
    background: rgba(10, 8, 6, .35);
    border-top: 1px solid #6e5428;
    padding: 12px 14px 14px;
  }
  .desc-labels {
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    gap: 6px;
    min-height: 32px;
    flex-shrink: 0;
  }
  .parent-label {
    flex: 0 1 auto;
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    color: #8d7a58;
    padding: 4px 10px;
    border-radius: 2px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .parent-label.active {
    color: #f0d060;
    background: #3a3418;
    border-color: #c9a227;
  }
  .parent-label.has-note {
    cursor: help;
    text-decoration: underline dotted #8a7020;
    text-underline-offset: 3px;
  }
  .parent-label.has-note:hover {
    color: #f0d060;
    background: #3a3418;
    border-color: #c9a227;
    text-decoration-color: #f0d060;
  }
  .desc-body {
    flex: 1;
    display: flex;
    min-height: 210px;
  }
  .desc-card {
    flex: 1;
    width: 100%;
    padding: 14px 16px 16px;
    border-radius: 2px;
    border: 1px solid transparent;
    background: rgba(28, 20, 14, .72);
    color: #d9c7a4;
    font-size: 16px;
    line-height: 1.6;
    box-shadow: inset 0 0 24px rgba(0,0,0,.28);
  }
  .desc-card.hovered { border-color: #8a7044; background: rgba(42, 30, 18, .8); }
  .desc-card.picked { border-color: #f4efe4; color: #f6edd8; background: rgba(48, 36, 22, .82); }
  .desc-card.learned {
    background: rgba(58, 46, 18, .88);
    color: #f0d060;
    border-color: #c9a227;
  }
  .desc-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 20px;
  }
  .desc-num {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 28px;
    height: 28px;
    border-radius: 2px;
    background: #2a2118;
    color: #e6d3a4;
    font-size: 16px;
    flex-shrink: 0;
  }
  .desc-card.learned .desc-num { background: #c9a227; color: #1a1a1a; }
  .desc-card.picked .desc-num {
    background: #4a3c28;
    color: #fff;
    box-shadow: 0 0 0 1px #fff;
  }
  .desc-recipes {
    margin: 0;
    padding: 0;
    list-style: none;
    color: #e4d2ae;
    font-size: 16px;
  }
  .desc-card.learned .desc-recipes { color: #f0d060; }
  .desc-prereq {
    margin-top: 10px;
    color: #a89068;
    font-size: 15px;
  }
  .desc-card.learned .desc-prereq { color: #b89a40; }

  .lock-tip {
    position: fixed;
    z-index: 20;
    max-width: 280px;
    padding: 10px 12px;
    background: rgba(12, 9, 6, .94);
    color: #f0d060;
    border: 1px solid #c9a227;
    border-radius: 2px;
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
    font-size: 15px;
    line-height: 1.5;
    pointer-events: none;
    white-space: pre-wrap;
  }
  .stage-head {
    display: grid;
    background: rgba(8, 6, 4, .35);
    border-bottom: 1px solid #6e5428;
  }
  .insight-bar,
  .mode-stack { grid-area: 1 / 1; }
  .insight-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }
  .stage-head.preset .insight-bar { min-height: 86px; }
  .mode-stack {
    display: none;
    justify-self: end;
    align-self: start;
    flex-direction: column;
    gap: 6px;
    padding: 8px 12px 0 0;
    z-index: 2;
  }
  .mode-stack.is-open { display: flex; }
  .mode-row { display: flex; gap: 6px; }
  .mode-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #2a2118;
    border: 1.5px solid #6e5428;
    border-radius: 2px;
    color: #f0d060;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .mode-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .mode-btn.on {
    border-color: #f0d060;
    box-shadow: 0 0 0 1px #c9a227;
  }
  .align-btn {
    width: 26px;
    height: 26px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #2a2118;
    border: 1.5px solid #6e5428;
    border-radius: 2px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .align-btn[hidden] { display: none; }
  .align-btn.on {
    border-color: #f0d060;
    box-shadow: 0 0 0 1px #c9a227;
  }
  .scheme-pop {
    position: fixed;
    z-index: 30;
    left: 50%;
    top: 18%;
    transform: translateX(-50%);
    width: min(420px, calc(100vw - 24px));
    max-height: calc(100vh - 24px);
    overflow: auto;
    padding: 14px 16px 12px;
    background: rgba(12, 9, 6, .96);
    color: #f0d060;
    border: 1px solid #c9a227;
    border-radius: 2px;
    box-shadow: 0 12px 32px rgba(0,0,0,.6);
    font-size: 15px;
    line-height: 1.55;
  }
  .scheme-pop.is-toast {
    top: 16px;
    pointer-events: none;
  }
  .scheme-title { font-weight: bold; letter-spacing: 1px; }
  .scheme-body {
    margin-top: 8px;
    color: #e6d3a4;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .scheme-body[hidden],
  .scheme-close[hidden] { display: none; }
  .scheme-close {
    display: block;
    margin: 12px 0 0 auto;
    padding: 4px 12px;
    background: #2a2118;
    color: #f0d060;
    border: 1px solid #c9a227;
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .insight-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 46px;
    height: 46px;
    padding: 0 8px;
    background: #3a2c16;
    border: 1.5px solid #c9a227;
    border-radius: 2px;
    color: #f0d060;
    font-size: 20px;
    font-weight: bold;
    line-height: 1;
  }
  .insight-label {
    color: #f0d060;
    font-size: 15px;
    letter-spacing: 1px;
  }

  .note-tip {
    width: max-content;
    max-width: min(420px, calc(100vw - 24px));
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    pointer-events: auto;
    overflow-wrap: anywhere;
  }

  .load-error {
    margin: 16px;
    padding: 12px;
    background: rgba(58, 24, 20, .9);
    color: #f0a0a0;
    border: 1px solid #8a4038;
    border-radius: 2px;
    font-size: 13px;
    white-space: pre-wrap;
  }

  @media (max-width: 720px) {
    body {
      padding: 12px 10px 24px;
      background-image:
        linear-gradient(rgba(18, 10, 16, .62), rgba(10, 6, 8, .78)),
        url("img/pe_background.jpg");
      background-position: center 18%;
    }
    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .toolbar select,
    .char-picker,
    .char-picker-btn { width: 100%; }
    .stage-head { display: flex; flex-direction: column; }
    .mode-stack {
      order: -1;
      align-self: stretch;
      align-items: center;
      padding: 10px 12px 0;
    }
    .insight-bar { order: 1; min-height: 0; }
    .desc-head { font-size: 18px; }
    .desc-card { font-size: 15px; }
    .parent-label {
      font-size: 13px;
      letter-spacing: 1px;
      padding: 2px 4px;
    }
    .note-tip { font-size: 14px; }
    .char-notice { right: 12px; bottom: 12px; }
    .insight-drawer { top: 8vh; max-height: 70vh; }
  }

  .char-notice {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 25;
    display: flex;
    flex-direction: column-reverse;
    align-items: flex-end;
    gap: 8px;
  }
  .char-notice[hidden] { display: none; }
  .char-notice-btn {
    width: 36px;
    height: 36px;
    padding: 0;
    border-radius: 50%;
    background: rgba(28, 20, 12, .48);
    border: 1.5px solid rgba(201, 162, 39, .45);
    color: rgba(240, 208, 96, .78);
    font-size: 20px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    font-family: inherit;
  }
  .char-notice-btn:hover,
  .char-notice.is-open .char-notice-btn {
    background: rgba(42, 30, 16, .88);
    border-color: #c9a227;
    color: #f0d060;
  }
  .char-notice-panel {
    width: min(320px, calc(100vw - 36px));
    max-height: 42vh;
    overflow: auto;
    padding: 12px 14px;
    background: rgba(12, 9, 6, .72);
    color: #e6d3a4;
    border: 1px solid rgba(201, 162, 39, .55);
    border-radius: 2px;
    box-shadow: 0 10px 28px rgba(0,0,0,.45);
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .char-notice-panel[hidden] { display: none; }
  .char-notice-title {
    color: #f0d060;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .insight-drawer {
    position: fixed;
    z-index: 24;
    left: 0;
    top: 12vh;
    max-height: 76vh;
    display: flex;
    align-items: stretch;
    transform: translateX(-100%);
    transition: transform .22s ease;
  }
  .insight-drawer[hidden] { display: none; }
  .insight-drawer.is-open { transform: translateX(0); }
  .insight-drawer-panel {
    width: min(300px, calc(100vw - 52px));
    overflow: auto;
    padding: 14px 16px 16px;
    background: rgba(12, 9, 6, .88);
    color: #e6d3a4;
    border: 1px solid rgba(201, 162, 39, .55);
    border-left: 0;
    border-radius: 0 2px 2px 0;
    box-shadow: 8px 10px 28px rgba(0,0,0,.45);
    font-size: 14px;
    line-height: 1.55;
  }
  .insight-drawer-title {
    color: #f0d060;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .insight-drawer-body {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .insight-drawer-handle {
    position: absolute;
    left: 100%;
    top: 28%;
    width: 32px;
    padding: 12px 4px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: rgba(28, 20, 12, .82);
    color: #f0d060;
    border: 1.5px solid rgba(201, 162, 39, .55);
    border-left: 0;
    border-radius: 0 4px 4px 0;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
  }
  .insight-drawer-label {
    writing-mode: vertical-rl;
  }
  .insight-drawer-arrow {
    font-size: 16px;
    letter-spacing: 0;
    line-height: 1;
  }
  .insight-drawer.is-open .insight-drawer-handle {
    background: rgba(42, 30, 16, .92);
    border-color: #c9a227;
  }
</style>
</head>
<body>
<div class="app">

<div class="toolbar">
  <div>
    <div class="char-picker" id="char-picker">
      <button type="button" class="char-picker-btn" id="char-picker-btn">
        <span id="char-picker-label">选择人物</span>
        <span aria-hidden="true">▾</span>
      </button>
      <div class="char-picker-menu" id="char-picker-menu" hidden></div>
    </div>
  </div>
  <select id="build-select">
    <option value="">自由加点</option>
  </select>
</div>

<div class="load-error" id="load-error" hidden></div>

<div class="stage-head" id="stage-head">
  <div class="insight-bar">
    <button type="button" class="align-btn" id="align-nice" data-align="nice" data-tip="好孩子加点（再点取消，变为无偏好）" hidden aria-pressed="false">😇</button>
    <span class="insight-box" id="points-text">15</span>
    <span class="insight-label">剩余洞察</span>
    <button type="button" class="align-btn" id="align-naughty" data-align="naughty" data-tip="淘气包加点（再点取消，变为无偏好）" hidden aria-pressed="false">😈</button>
  </div>
  <div class="mode-stack" id="mode-stack">
    <div class="mode-row">
      <button type="button" class="mode-btn" data-mode="lunar" data-tip="解锁月后加点" aria-pressed="false">
        <img src="img/moon.png" alt="月后" draggable="false">
      </button>
      <button type="button" class="mode-btn" data-mode="shadow" data-tip="解锁影后加点" aria-pressed="false">
        <img src="img/dark.png" alt="影后" draggable="false">
      </button>
    </div>
    <div class="mode-row">
      <button type="button" class="mode-btn mode-emoji" data-mode="solo" data-tip="单人模式" aria-pressed="false">👤</button>
      <button type="button" class="mode-btn mode-emoji" data-mode="multi" data-tip="多人模式" aria-pressed="false">👥</button>
    </div>
  </div>
</div>

<svg viewBox="-300 -210 600 460">
  <rect id="tree-bg" x="-300" y="-210" width="600" height="460" fill="#120e0b" fill-opacity="0.55"/>
  <g id="group-titles"></g>
  <g id="nodes"></g>
  <g id="node-labels"></g>
  <g id="buttons">
    <rect id="learn-bg" x="-220" y="150" width="180" height="43" rx="2" fill="#2a2118" stroke="#6e5428" stroke-width="1.5"/>
    <rect id="reset-bg" x="40"  y="150" width="180" height="43" rx="2" fill="#2a2118" stroke="#6e5428" stroke-width="1.5"/>
    <text id="learn-text" x="-130" y="177.5" text-anchor="middle" font-size="16" fill="#fff">学习</text>
    <text id="reset-text" x="130"  y="177.5" text-anchor="middle" font-size="16" fill="#fff">重置洞察</text>
    <rect id="btn-learn" x="-220" y="150" width="180" height="43" fill="transparent" style="cursor:pointer"/>
    <rect id="btn-reset" x="40"  y="150" width="180" height="43" fill="transparent" style="cursor:pointer"/>
  </g>
</svg>

<div class="status-bar">
  <span>已学习：<span class="points" id="learned-count">0</span> / <span id="skill-total">0</span></span>
</div>

<div class="desc-panel" id="desc-panel"></div>
</div>

<div id="lock-tip" class="lock-tip" hidden></div>
<div id="note-tip" class="lock-tip note-tip" hidden></div>
<div id="mode-tip" class="lock-tip" hidden></div>
<aside class="insight-drawer" id="insight-drawer" hidden>
  <div class="insight-drawer-panel">
    <div class="insight-drawer-title" id="insight-drawer-title">个人见解</div>
    <div class="insight-drawer-body" id="insight-drawer-body"></div>
  </div>
  <button type="button" class="insight-drawer-handle" id="insight-drawer-handle" aria-expanded="false">
    <span class="insight-drawer-label">个人见解</span>
    <span class="insight-drawer-arrow" id="insight-drawer-arrow">&gt;</span>
  </button>
</aside>

<aside class="char-notice" id="char-notice" hidden>
  <button type="button" class="char-notice-btn" id="char-notice-btn" aria-expanded="false" aria-controls="char-notice-panel" title="角色总结">!</button>
  <div class="char-notice-panel" id="char-notice-panel" hidden>
    <div class="char-notice-title" id="char-notice-title">总结</div>
    <div class="char-notice-body" id="char-notice-body"></div>
  </div>
</aside>

<div id="scheme-pop" class="scheme-pop" hidden>
  <div class="scheme-title" id="scheme-title"></div>
  <div class="scheme-body" id="scheme-body"></div>
  <button type="button" class="scheme-close" id="scheme-close">确认</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
