<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>技能树</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: sans-serif;
    padding: 24px;
  }
  .app {
    width: 600px;
    background: #2a2a2a;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
  }
  svg { display: block; width: 100%; height: 460px; }
  text { user-select: none; pointer-events: none; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: #1e1e1e;
    border-bottom: 1px solid #333;
    font-size: 13px;
    color: #aaa;
  }
  .toolbar select {
    background: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
  }
  .char-title { color: #f0d060; font-weight: bold; }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px;
    background: #1e1e1e;
    border-top: 1px solid #333;
    font-size: 13px;
    color: #aaa;
  }
  .status-bar .points { color: #f0d060; font-weight: bold; }

  .desc-panel {
    display: flex;
    flex-direction: column;
    min-height: 280px;
    background: #222;
    border-top: 1px solid #3a3a3a;
    padding: 12px 14px 14px;
  }
  .desc-labels {
    position: relative;
    height: 32px;
    flex-shrink: 0;
  }
  .parent-label {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    color: #666;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .parent-label.active {
    color: #f0d060;
    background: #3a3418;
    border-color: #c9a227;
  }
  .parent-label.has-note {
    cursor: help;
    text-decoration: underline dotted #8a7020;
    text-underline-offset: 3px;
  }
  .parent-label.has-note:hover {
    color: #f0d060;
    background: #3a3418;
    border-color: #c9a227;
    text-decoration-color: #f0d060;
  }
  .desc-body {
    flex: 1;
    display: flex;
    min-height: 210px;
  }
  .desc-card {
    flex: 1;
    width: 100%;
    padding: 14px 16px 16px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: #2a2a2a;
    color: #bbb;
    font-size: 16px;
    line-height: 1.6;
  }
  .desc-card.hovered { border-color: #888; background: #303030; }
  .desc-card.picked { border-color: #fff; color: #eee; background: #333; }
  .desc-card.learned {
    background: #3a3418;
    color: #f0d060;
    border-color: #c9a227;
  }
  .desc-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 20px;
  }
  .desc-num {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    background: #3a3a3a;
    color: #ccc;
    font-size: 16px;
    flex-shrink: 0;
  }
  .desc-card.learned .desc-num { background: #c9a227; color: #1a1a1a; }
  .desc-card.picked .desc-num {
    background: #555;
    color: #fff;
    box-shadow: 0 0 0 1px #fff;
  }
  .desc-recipes {
    margin: 8px 0 0 22px;
    color: #c8c8c8;
    font-size: 16px;
  }
  .desc-card.learned .desc-recipes { color: #f0d060; }
  .desc-prereq {
    margin-top: 10px;
    color: #777;
    font-size: 15px;
  }
  .desc-card.learned .desc-prereq { color: #b89a40; }

  .lock-tip {
    position: fixed;
    z-index: 20;
    max-width: 280px;
    padding: 10px 12px;
    background: #111;
    color: #f0d060;
    border: 1px solid #c9a227;
    border-radius: 6px;
    font-size: 15px;
    line-height: 1.5;
    pointer-events: none;
    white-space: pre-wrap;
  }
  .note-tip {
    max-width: 420px;
    pointer-events: auto;
  }

  .load-error {
    margin: 16px;
    padding: 12px;
    background: #3a2222;
    color: #f0a0a0;
    border-radius: 6px;
    font-size: 13px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="app">

<div class="toolbar">
  <div>
    <select id="char-select"></select>
    <span class="char-title" id="char-title"></span>
  </div>
  <select id="build-select">
    <option value="">加点建议…</option>
  </select>
</div>

<div class="load-error" id="load-error" hidden></div>

<svg width="600" height="460" viewBox="-300 -210 600 460">
  <rect x="-300" y="-210" width="600" height="460" fill="#2a2a2a"/>
  <rect x="-22" y="-190" width="50" height="50" rx="6" fill="#4a3a1a" stroke="#c9a227" stroke-width="1.5"/>
  <text x="3" y="-157" text-anchor="middle" font-size="20" fill="#f0d060" id="points-text">15</text>
  <text x="33" y="-157" font-size="15" fill="#f0d060">剩余洞察</text>
  <g id="nodes"></g>
  <g id="node-labels"></g>
  <g id="buttons">
    <rect id="learn-bg" x="-220" y="150" width="180" height="43" rx="6" fill="#4a4a4a" stroke="#777" stroke-width="1.5"/>
    <rect id="reset-bg" x="40"  y="150" width="180" height="43" rx="6" fill="#4a4a4a" stroke="#777" stroke-width="1.5"/>
    <text id="learn-text" x="-130" y="177.5" text-anchor="middle" font-size="16" fill="#fff">学习</text>
    <text id="reset-text" x="130"  y="177.5" text-anchor="middle" font-size="16" fill="#fff">重置洞察</text>
    <rect id="btn-learn" x="-220" y="150" width="180" height="43" fill="transparent" style="cursor:pointer"/>
    <rect id="btn-reset" x="40"  y="150" width="180" height="43" fill="transparent" style="cursor:pointer"/>
  </g>
</svg>

<div class="status-bar">
  <span>已学习：<span class="points" id="learned-count">0</span> / <span id="skill-total">0</span></span>
</div>

<div class="desc-panel" id="desc-panel"></div>
</div>

<div id="lock-tip" class="lock-tip" hidden></div>
<div id="note-tip" class="lock-tip note-tip" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
