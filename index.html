<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    color: #e6d7b8;
    font-family: Palatino, "Palatino Linotype", "Songti SC", "STSong", "Noto Serif SC", serif;
    background-color: #0c0907;
    background-image:
      radial-gradient(ellipse at center, rgba(12,8,6,.28) 0%, rgba(6,4,3,.72) 72%, rgba(0,0,0,.88) 100%),
      linear-gradient(rgba(8,6,4,.5), rgba(8,6,4,.62)),
      url("img/Pc_background.jpg");
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
  }
  .menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 6px;
    line-height: .82;
    font-weight: 700;
    color: #f4e3b4;
    -webkit-text-stroke: 1px #2a180c;
    text-shadow:
      0 1px 0 #6e4c24,
      0 3px 0 #2a180c,
      2px 4px 0 #120c08,
      0 0 18px rgba(0, 0, 0, .55);
  }
  .brand-dont {
    font-size: clamp(26px, 3.6vw, 44px);
    letter-spacing: .28em;
    padding-left: .28em;
  }
  .brand-starve {
    font-size: clamp(40px, 6vw, 76px);
    letter-spacing: .08em;
  }
  .selector {
    position: relative;
    display: block;
    width: 25vw;
    text-decoration: none;
  }
  .selector-frame {
    display: block;
    width: 100%;
    height: auto;
  }
  .selector span {
    position: absolute;
    left: 18%;
    right: 18%;
    top: 46.8%;
    transform: translateY(-50%);
    text-align: center;
    color: #f0e2c0;
    font-size: 16px;
    letter-spacing: 0.28em;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
  }
  .selector:hover span { color: #f0d060; }
  @media (max-width: 720px) {
    body {
      padding: 12px 10px 24px;
      background-image:
        linear-gradient(rgba(18, 10, 16, .62), rgba(10, 6, 8, .78)),
        url("img/pe_background.jpg");
      background-position: center 18%;
    }
    .selector { width: 85vw; }
    .selector span { font-size: 18px; }
    .brand-dont { font-size: 28px; }
    .brand-starve { font-size: 46px; }
  }
</style>
</head>
<body>
  <div class="menu">
    <h1 class="brand">
      <span class="brand-dont">DON'T</span>
      <span class="brand-starve">STARVE</span>
    </h1>
    <a class="selector" href="skill.html">
      <img class="selector-frame" src="img/selection.png" alt="">
      <span>技能树</span>
    </a>
    <a class="selector" href="monster.html">
      <img class="selector-frame" src="img/selection.png" alt="">
      <span>怪物</span>
    </a>
    <a class="selector" href="storyline.html">
      <img class="selector-frame" src="img/selection.png" alt="">
      <span>主线</span>
    </a>
    <a class="selector" href="foodfarm.html">
      <img class="selector-frame" src="img/selection.png" alt="">
      <span>料理与种植</span>
    </a>
  </div>
</body>
</html>
