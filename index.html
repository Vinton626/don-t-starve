<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技能树</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 20px 40px;
    color: #e6d7b8;
    font-family: Palatino, "Palatino Linotype", "Songti SC", "STSong", "Noto Serif SC", serif;
    background-color: #0c0907;
    background-image:
      radial-gradient(ellipse at center, rgba(12,8,6,.28) 0%, rgba(6,4,3,.72) 72%, rgba(0,0,0,.88) 100%),
      linear-gradient(rgba(8,6,4,.5), rgba(8,6,4,.62)),
      url("img/Pc_background.jpg");
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .app {
    width: 600px;
    max-width: 100%;
    background: rgba(16, 11, 8, .84);
    border: 1px solid #a6843f;
    border-radius: 2px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px #2a1c10,
      0 22px 50px rgba(0,0,0,.72),
      inset 0 0 80px rgba(0,0,0,.35);
  }
  svg { display: block; width: 100%; height: auto; }
  text { user-select: none; pointer-events: none; }
  .group-title-hit { cursor: default; }
  .group-title-hit.has-note { cursor: help; }
  .group-title.has-note { text-decoration: underline dotted #8a7030; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(8, 6, 4, .55);
    border-bottom: 1px solid #6e5428;
    font-size: 14px;
    color: #cbb892;
  }
  .toolbar select {
    background: rgba(28, 20, 12, .9);
    color: #f0e2c0;
    border: 1px solid #8a6a32;
    border-radius: 2px;
    padding: 5px 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .char-title {
    color: #f0d060;
    font-weight: bold;
    letter-spacing: 2px;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px;
    background: rgba(8, 6, 4, .55);
    border-top: 1px solid #6e5428;
    font-size: 14px;
    color: #cbb892;
    letter-spacing: 1px;
  }
  .status-bar .points { color: #f0d060; font-weight: bold; }

  .desc-panel {
    display: flex;
    flex-direction: column;
    min-height: 280px;
    background: rgba(10, 8, 6, .35);
    border-top: 1px solid #6e5428;
    padding: 12px 14px 14px;
  }
  .desc-labels {
    position: relative;
    height: 32px;
    flex-shrink: 0;
  }
  .parent-label {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    color: #8d7a58;
    padding: 4px 10px;
    border-radius: 2px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .parent-label.active {
    color: #f0d060;
    background: #3a3418;
    border-color: #c9a227;
  }
  .parent-label.has-note {
    cursor: help;
    text-decoration: underline dotted #8a7020;
    text-underline-offset: 3px;
  }
  .parent-label.has-note:hover {
    color: #f0d060;
    background: #3a3418;
    border-color: #c9a227;
    text-decoration-color: #f0d060;
  }
  .desc-body {
    flex: 1;
    display: flex;
    min-height: 210px;
  }
  .desc-card {
    flex: 1;
    width: 100%;
    padding: 14px 16px 16px;
    border-radius: 2px;
    border: 1px solid transparent;
    background: rgba(28, 20, 14, .72);
    color: #d9c7a4;
    font-size: 16px;
    line-height: 1.6;
    box-shadow: inset 0 0 24px rgba(0,0,0,.28);
  }
  .desc-card.hovered { border-color: #8a7044; background: rgba(42, 30, 18, .8); }
  .desc-card.picked { border-color: #f4efe4; color: #f6edd8; background: rgba(48, 36, 22, .82); }
  .desc-card.learned {
    background: rgba(58, 46, 18, .88);
    color: #f0d060;
    border-color: #c9a227;
  }
  .desc-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 20px;
  }
  .desc-num {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 28px;
    height: 28px;
    border-radius: 2px;
    background: #2a2118;
    color: #e6d3a4;
    font-size: 16px;
    flex-shrink: 0;
  }
  .desc-card.learned .desc-num { background: #c9a227; color: #1a1a1a; }
  .desc-card.picked .desc-num {
    background: #4a3c28;
    color: #fff;
    box-shadow: 0 0 0 1px #fff;
  }
  .desc-recipes {
    margin: 8px 0 0 22px;
    color: #e4d2ae;
    font-size: 16px;
  }
  .desc-card.learned .desc-recipes { color: #f0d060; }
  .desc-prereq {
    margin-top: 10px;
    color: #a89068;
    font-size: 15px;
  }
  .desc-card.learned .desc-prereq { color: #b89a40; }

  .lock-tip {
    position: fixed;
    z-index: 20;
    max-width: 280px;
    padding: 10px 12px;
    background: rgba(12, 9, 6, .94);
    color: #f0d060;
    border: 1px solid #c9a227;
    border-radius: 2px;
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
    font-size: 15px;
    line-height: 1.5;
    pointer-events: none;
    white-space: pre-wrap;
  }
  .note-tip {
    max-width: 420px;
    pointer-events: auto;
  }

  .load-error {
    margin: 16px;
    padding: 12px;
    background: rgba(58, 24, 20, .9);
    color: #f0a0a0;
    border: 1px solid #8a4038;
    border-radius: 2px;
    font-size: 13px;
    white-space: pre-wrap;
  }

  @media (max-width: 720px) {
    body {
      padding: 12px 10px 24px;
      background-image:
        linear-gradient(rgba(18, 10, 16, .62), rgba(10, 6, 8, .78)),
        url("img/pe_background.jpg");
      background-position: center 18%;
    }
    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .toolbar select { width: 100%; }
    .desc-head { font-size: 18px; }
    .desc-card { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="app">

<div class="toolbar">
  <div>
    <select id="char-select"></select>
    <span class="char-title" id="char-title"></span>
  </div>
  <select id="build-select">
    <option value="">加点建议…</option>
  </select>
</div>

<div class="load-error" id="load-error" hidden></div>

<svg viewBox="-300 -210 600 460">
  <rect x="-300" y="-210" width="600" height="460" fill="#120e0b" fill-opacity="0.55"/>
  <rect x="-22" y="-190" width="50" height="50" rx="2" fill="#3a2c16" stroke="#c9a227" stroke-width="1.5"/>
  <text x="3" y="-157" text-anchor="middle" font-size="20" fill="#f0d060" id="points-text">15</text>
  <text x="33" y="-157" font-size="15" fill="#f0d060">剩余洞察</text>
  <g id="group-titles"></g>
  <g id="nodes"></g>
  <g id="node-labels"></g>
  <g id="buttons">
    <rect id="learn-bg" x="-220" y="150" width="180" height="43" rx="2" fill="#2a2118" stroke="#6e5428" stroke-width="1.5"/>
    <rect id="reset-bg" x="40"  y="150" width="180" height="43" rx="2" fill="#2a2118" stroke="#6e5428" stroke-width="1.5"/>
    <text id="learn-text" x="-130" y="177.5" text-anchor="middle" font-size="16" fill="#fff">学习</text>
    <text id="reset-text" x="130"  y="177.5" text-anchor="middle" font-size="16" fill="#fff">重置洞察</text>
    <rect id="btn-learn" x="-220" y="150" width="180" height="43" fill="transparent" style="cursor:pointer"/>
    <rect id="btn-reset" x="40"  y="150" width="180" height="43" fill="transparent" style="cursor:pointer"/>
  </g>
</svg>

<div class="status-bar">
  <span>已学习：<span class="points" id="learned-count">0</span> / <span id="skill-total">0</span></span>
</div>

<div class="desc-panel" id="desc-panel"></div>
</div>

<div id="lock-tip" class="lock-tip" hidden></div>
<div id="note-tip" class="lock-tip note-tip" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
