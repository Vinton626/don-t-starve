<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>种植篇</title>
<link rel="stylesheet" href="../../css/common-tags.css">
<link rel="stylesheet" href="../../css/foodfarm.css?v=30">
</head>
<body class="farm-page">
  <aside class="mod-drawer" id="mod-drawer">
    <div class="mod-drawer-panel">
      <div class="mod-drawer-title">模组选择</div>
      <div class="mod-checks" id="mod-list"></div>
    </div>
    <button type="button" class="mod-drawer-handle" id="mod-drawer-handle" aria-expanded="false">
      <span>模组选择</span>
      <span class="mod-drawer-arrow" id="mod-drawer-arrow">&gt;</span>
    </button>
  </aside>
  <a class="home-fab" href="../../index.html">首页</a>
  <a class="home-fab back-fab" href="../foodfarm.html">上一页</a>

  <aside class="side-drawer calc-drawer" id="calc-drawer">
    <div class="side-drawer-panel" id="calc-picker-home">
      <div class="calc-picker" id="calc-picker">
        <div class="side-drawer-title">配比计算器</div>
        <input type="search" class="side-search" id="calc-search" placeholder="搜索种子 / 作物" autocomplete="off">
        <div class="calc-selected" id="calc-selected"></div>
        <div class="calc-seeds" id="calc-seeds"></div>
      </div>
    </div>
    <button type="button" class="side-drawer-handle" id="calc-drawer-handle" aria-expanded="false">配比计算器</button>
  </aside>

  <aside class="side-drawer filter-drawer" id="filter-drawer">
    <button type="button" class="side-drawer-handle" id="filter-drawer-handle" aria-expanded="false">筛选</button>
    <div class="side-drawer-panel">
      <div class="side-drawer-title">筛选</div>
      <input type="search" class="side-search" id="plant-search" placeholder="搜索作物 / 种子名" autocomplete="off">
      <div class="filter-group">
        <div class="filter-label">适合季节</div>
        <div class="filter-checks" data-filter="fit"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">排除季节</div>
        <div class="filter-checks" data-filter="exclude"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">消耗肥料</div>
        <div class="filter-checks tag-text" data-filter="consume"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">产生肥料</div>
        <div class="filter-checks tag-text" data-filter="produce"></div>
      </div>
      <button type="button" class="filter-reset" id="filter-reset">清空筛选</button>
    </div>
  </aside>

  <div class="page">
    <h1 class="title">种植篇</h1>
    <main class="content-host">
      <div class="panel-body" id="plant-body"></div>
    </main>
  </div>

  <section class="calc-panel" id="calc-panel" hidden>
    <div class="calc-panel-head">
      <button type="button" class="calc-config-btn" id="calc-config-btn" aria-expanded="false">选择种子</button>
      <div class="calc-panel-title">配比计算</div>
      <div class="calc-mode" id="calc-mode">
        <button type="button" class="calc-mode-btn" id="calc-mode-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="calc-mode-list">
          <span id="calc-mode-label">9格配比</span>
          <span class="calc-mode-caret" aria-hidden="true">▾</span>
        </button>
        <div class="calc-mode-list" id="calc-mode-list" role="listbox" hidden>
          <button type="button" class="calc-mode-opt" role="option" data-mode="1-1" aria-selected="false">1:1配比<span class="calc-mode-tip" role="tooltip">与所选作物各种 1 株，三种肥料都不为负。点另一株会换掉当前选择。</span></button>
          <button type="button" class="calc-mode-opt" role="option" data-mode="3-3-3" aria-selected="false">3+3+3配比<span class="calc-mode-tip" role="tooltip">每株计数只能是 3 或 6，合计 9 格。可做 3+3+3，或 3+6；已选之外的格按同样规则补齐。</span></button>
          <button type="button" class="calc-mode-opt is-on" role="option" data-mode="9" aria-selected="true">9格配比<span class="calc-mode-tip" role="tooltip">这里需要添加</span></button>
        </div>
      </div>
      <label class="mod-check calc-season-check">
        <input type="checkbox" id="calc-season-check">
        <span>考虑季节</span>
      </label>
      <button type="button" class="food-modal-close" id="calc-panel-close" aria-label="关闭">×</button>
    </div>
    <div class="calc-net tag-text" id="calc-net"></div>
    <div class="calc-body tag-text" id="calc-body"></div>
    <div class="calc-config" id="calc-config" hidden>
      <div class="calc-config-body" id="calc-config-body"></div>
    </div>
  </section>

  <div class="food-modal" id="seed-modal" hidden>
    <div class="food-modal-backdrop" data-close="seed-modal"></div>
    <div class="food-modal-panel" role="dialog" aria-modal="true" aria-labelledby="seed-modal-title">
      <div class="food-modal-head">
        <h2 class="food-modal-title" id="seed-modal-title">种子</h2>
        <button type="button" class="food-modal-close" data-close="seed-modal" aria-label="关闭">×</button>
      </div>
      <div class="food-modal-stats tag-text" id="seed-modal-fert"></div>
      <div class="food-modal-stats tag-text" id="seed-modal-stats"></div>
      <div class="seed-modal-desc tag-text" id="seed-modal-desc"></div>
    </div>
  </div>

  <div class="food-modal plan-modal" id="plan-modal" hidden>
    <div class="food-modal-backdrop" data-close="plan-modal"></div>
    <div class="food-modal-panel" role="dialog" aria-modal="true" aria-labelledby="plan-modal-title">
      <div class="food-modal-head">
        <h2 class="food-modal-title" id="plan-modal-title">配比详情</h2>
        <button type="button" class="food-modal-close" data-close="plan-modal" aria-label="关闭">×</button>
      </div>
      <div class="food-modal-stats tag-text" id="plan-modal-net"></div>
      <div class="plan-rows tag-text" id="plan-modal-rows"></div>
    </div>
  </div>

  <aside class="page-overview" id="page-overview">
    <button type="button" class="page-overview-btn" id="page-overview-btn" aria-expanded="false" aria-controls="page-overview-panel" title="概述">概述</button>
    <div class="page-overview-panel" id="page-overview-panel" hidden>
      <div class="page-overview-title" id="page-overview-title">概述</div>
      <div class="page-overview-body tag-text" id="page-overview-body">看作物每阶段三肥净值、耗水/阶段与适宜季节。左侧配比计算器只按三肥凑中性（耗水不参与）；勾选「考虑季节」后，每条配比会标出各作物共同适合的季节（由各自不喜季节取并集后，看四季里还剩哪些；没有共同季节则不显示）。右侧按季节与肥料筛选。</div>
    </div>
  </aside>

  <div id="notice-tip" class="notice-tip tag-text" hidden></div>
  <script>window.APP_ROOT = "../../";</script>
  <script src="../../js/common/tags.js?v=13"></script>
  <script src="../../js/foodfarm/common.js?v=20"></script>
  <script src="../../js/foodfarm/farm-calc.js?v=13"></script>
  <script src="../../js/foodfarm/farm.js?v=21"></script>
</body>
</html>
