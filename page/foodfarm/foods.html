<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>普通食物图鉴</title>
<link rel="stylesheet" href="../../css/common-tags.css">
<link rel="stylesheet" href="../../css/foodfarm.css?v=34">
</head>
<body>
  <aside class="mod-drawer" id="mod-drawer">
    <div class="mod-drawer-panel">
      <div class="mod-drawer-title">模组选择</div>
      <div class="mod-checks" id="mod-list"></div>
    </div>
    <button type="button" class="mod-drawer-handle" id="mod-drawer-handle" aria-expanded="false">
      <span>模组选择</span>
      <span class="mod-drawer-arrow" id="mod-drawer-arrow">&gt;</span>
    </button>
  </aside>
  <a class="home-fab" href="../../index.html">首页</a>
  <a class="home-fab back-fab" href="../foodfarm.html">上一页</a>

  <aside class="side-drawer filter-drawer" id="food-filter-drawer">
    <button type="button" class="side-drawer-handle" id="food-filter-handle" aria-expanded="false">筛选</button>
    <div class="side-drawer-panel">
      <div class="side-drawer-title">筛选</div>
      <input type="search" class="side-search" id="food-search" placeholder="搜索食物名" autocomplete="off">
      <button type="button" class="filter-reset" id="food-filter-reset">清空筛选</button>
    </div>
  </aside>

  <div class="page">
    <h1 class="title">普通食物图鉴</h1>
    <main class="content-host">
      <div class="panel-body" id="food-body"></div>
    </main>
  </div>

  <div class="food-modal" id="food-modal" hidden>
    <div class="food-modal-backdrop" id="food-modal-backdrop"></div>
    <div class="food-modal-panel" role="dialog" aria-modal="true" aria-labelledby="food-modal-title">
      <div class="food-modal-head">
        <h2 class="food-modal-title" id="food-modal-title">食物</h2>
        <button type="button" class="food-modal-close" id="food-modal-close" aria-label="关闭">×</button>
      </div>
      <div class="food-modal-stats tag-text" id="food-modal-stats"></div>
      <div class="food-modal-meta" id="food-modal-meta"></div>
      <div class="food-modal-block">
        <div class="food-modal-label">烹饪度</div>
        <div class="food-modal-degrees tag-text" id="food-modal-degrees"></div>
      </div>
      <div id="food-modal-seed"></div>
      <div class="food-cook">
        <button type="button" class="food-cook-toggle" id="food-cook-toggle" aria-expanded="false" aria-controls="food-cook-panel">
          <span>可做料理</span>
          <span class="food-cook-arrow" id="food-cook-arrow">▸</span>
        </button>
        <div class="food-cook-panel" id="food-cook-panel" hidden>
          <input type="search" class="food-cook-search" id="food-cook-search" placeholder="搜索料理名" autocomplete="off">
          <div class="food-cook-list" id="food-cook-list"></div>
        </div>
      </div>
    </div>
  </div>

  <aside class="page-overview" id="page-overview">
    <button type="button" class="page-overview-btn" id="page-overview-btn" aria-expanded="false" aria-controls="page-overview-panel" title="概述">概述</button>
    <div class="page-overview-panel" id="page-overview-panel" hidden>
      <div class="page-overview-title" id="page-overview-title">概述</div>
      <div class="page-overview-body tag-text" id="page-overview-body">只展示普通食物：三维、食用类型与烹饪度。有 <code>cooked</code> / <code>dried</code> 时右上角分开两个按钮，晾在烤左边，点一下切到该形态，再点回到生。都没有则显示 *，悬停「不可烤不可晾」。点卡片看详情。料理图鉴在料理篇。</div>
    </div>
  </aside>

  <div id="notice-tip" class="notice-tip tag-text" hidden></div>
  <script>window.APP_ROOT = "../../";</script>
  <script src="../../js/common/tags.js?v=15"></script>
  <script src="../../js/foodfarm/common.js?v=22"></script>
  <script src="../../js/foodfarm/foods.js?v=18"></script>
</body>
</html>
