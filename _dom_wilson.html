<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>濞佸皵閫?路 鎶€鑳芥爲</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 20px 40px;
    color: #e6d7b8;
    font-family: Palatino, "Palatino Linotype", "Songti SC", "STSong", "Noto Serif SC", serif;
    background-color: #0c0907;
    background-image:
      radial-gradient(ellipse at center, rgba(12,8,6,.28) 0%, rgba(6,4,3,.72) 72%, rgba(0,0,0,.88) 100%),
      linear-gradient(rgba(8,6,4,.5), rgba(8,6,4,.62)),
      url("img/Pc_background.jpg");
    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .app {
    width: 600px;
    max-width: 100%;
    background: rgba(16, 11, 8, .84);
    border: 1px solid #a6843f;
    border-radius: 2px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px #2a1c10,
      0 22px 50px rgba(0,0,0,.72),
      inset 0 0 80px rgba(0,0,0,.35);
  }
  svg { display: block; width: 100%; height: auto; }
  text { user-select: none; pointer-events: none; }
  .group-title-hit { cursor: default; }
  .group-title-hit.has-note { cursor: help; }
  .group-title.has-note { text-decoration: underline dotted #8a7030; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(8, 6, 4, .55);
    border-bottom: 1px solid #6e5428;
    font-size: 14px;
    color: #cbb892;
  }
  .toolbar select,
  .char-picker-btn {
    background: rgba(28, 20, 12, .9);
    color: #f0e2c0;
    border: 1px solid #8a6a32;
    border-radius: 2px;
    padding: 5px 8px;
    font-size: 14px;
    font-family: inherit;
  }
  .char-picker { position: relative; }
  .char-picker-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-width: 7.5em;
    cursor: pointer;
  }
  .char-picker-menu {
    position: absolute;
    z-index: 15;
    top: calc(100% + 4px);
    left: 0;
    min-width: 100%;
    padding: 4px 0;
    background: rgba(22, 16, 10, .98);
    border: 1px solid #8a6a32;
    border-radius: 2px;
    box-shadow: 0 10px 24px rgba(0,0,0,.45);
  }
  .char-option {
    display: block;
    width: 100%;
    padding: 6px 10px;
    background: transparent;
    border: 0;
    color: #f0e2c0;
    font: inherit;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .char-option:hover,
  .char-option.current { color: #f0d060; background: #3a3418; }
  .char-option.is-locked,
  .char-option.is-locked:hover {
    color: #6d5c48;
    background: transparent;
    cursor: default;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px;
    background: rgba(8, 6, 4, .55);
    border-top: 1px solid #6e5428;
    font-size: 14px;
    color: #cbb892;
    letter-spacing: 1px;
  }
  .status-bar .points { color: #f0d060; font-weight: bold; }

  .desc-panel {
    display: flex;
    flex-direction: column;
    min-height: 280px;
    background: rgba(10, 8, 6, .35);
    border-top: 1px solid #6e5428;
    padding: 12px 14px 14px;
  }
  .desc-labels {
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    gap: 6px;
    min-height: 32px;
    flex-shrink: 0;
  }
  .parent-label {
    flex: 0 1 auto;
    text-align: center;
    font-size: 15px;
    letter-spacing: 2px;
    color: #8d7a58;
    padding: 4px 10px;
    border-radius: 2px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .parent-label.active {
    color: #f0d060;
    background: #3a3418;
    border-color: #c9a227;
  }
  .parent-label.has-note {
    cursor: help;
    text-decoration: underline dotted #8a7020;
    text-underline-offset: 3px;
  }
  .parent-label.has-note:hover {
    color: #f0d060;
    background: #3a3418;
    border-color: #c9a227;
    text-decoration-color: #f0d060;
  }
  .desc-body {
    flex: 1;
    display: flex;
    min-height: 210px;
  }
  .desc-card {
    flex: 1;
    width: 100%;
    padding: 14px 16px 16px;
    border-radius: 2px;
    border: 1px solid transparent;
    background: rgba(28, 20, 14, .72);
    color: #d9c7a4;
    font-size: 16px;
    line-height: 1.6;
    box-shadow: inset 0 0 24px rgba(0,0,0,.28);
  }
  .desc-card.hovered { border-color: #8a7044; background: rgba(42, 30, 18, .8); }
  .desc-card.picked { border-color: #f4efe4; color: #f6edd8; background: rgba(48, 36, 22, .82); }
  .desc-card.learned {
    background: rgba(58, 46, 18, .88);
    color: #f0d060;
    border-color: #c9a227;
  }
  .desc-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 20px;
  }
  .desc-num {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 28px;
    height: 28px;
    border-radius: 2px;
    background: #2a2118;
    color: #e6d3a4;
    font-size: 16px;
    flex-shrink: 0;
  }
  .desc-card.learned .desc-num { background: #c9a227; color: #1a1a1a; }
  .desc-card.picked .desc-num {
    background: #4a3c28;
    color: #fff;
    box-shadow: 0 0 0 1px #fff;
  }
  .desc-recipes {
    margin: 8px 0 0 22px;
    color: #e4d2ae;
    font-size: 16px;
  }
  .desc-card.learned .desc-recipes { color: #f0d060; }
  .desc-prereq {
    margin-top: 10px;
    color: #a89068;
    font-size: 15px;
  }
  .desc-card.learned .desc-prereq { color: #b89a40; }

  .lock-tip {
    position: fixed;
    z-index: 20;
    max-width: 280px;
    padding: 10px 12px;
    background: rgba(12, 9, 6, .94);
    color: #f0d060;
    border: 1px solid #c9a227;
    border-radius: 2px;
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
    font-size: 15px;
    line-height: 1.5;
    pointer-events: none;
    white-space: pre-wrap;
  }
  .stage-head {
    display: grid;
    background: rgba(8, 6, 4, .35);
    border-bottom: 1px solid #6e5428;
  }
  .insight-bar,
  .mode-stack { grid-area: 1 / 1; }
  .insight-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
  }
  .stage-head.preset .insight-bar { min-height: 86px; }
  .mode-stack {
    display: none;
    justify-self: end;
    align-self: start;
    flex-direction: column;
    gap: 6px;
    padding: 8px 12px 0 0;
    z-index: 2;
  }
  .mode-stack.is-open { display: flex; }
  .mode-row { display: flex; gap: 6px; }
  .mode-btn {
    width: 28px;
    height: 28px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #2a2118;
    border: 1.5px solid #6e5428;
    border-radius: 2px;
    color: #f0d060;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .mode-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .mode-btn.on {
    border-color: #f0d060;
    box-shadow: 0 0 0 1px #c9a227;
  }
  .align-btn {
    width: 26px;
    height: 26px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #2a2118;
    border: 1.5px solid #6e5428;
    border-radius: 2px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .align-btn[hidden] { display: none; }
  .align-btn.on {
    border-color: #f0d060;
    box-shadow: 0 0 0 1px #c9a227;
  }
  .scheme-pop {
    position: fixed;
    z-index: 30;
    left: 50%;
    top: 18%;
    transform: translateX(-50%);
    width: min(420px, calc(100vw - 24px));
    max-height: calc(100vh - 24px);
    overflow: auto;
    padding: 14px 16px 12px;
    background: rgba(12, 9, 6, .96);
    color: #f0d060;
    border: 1px solid #c9a227;
    border-radius: 2px;
    box-shadow: 0 12px 32px rgba(0,0,0,.6);
    font-size: 15px;
    line-height: 1.55;
  }
  .scheme-title { font-weight: bold; letter-spacing: 1px; }
  .scheme-body {
    margin-top: 8px;
    color: #e6d3a4;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .scheme-body[hidden],
  .scheme-close[hidden] { display: none; }
  .scheme-close {
    display: block;
    margin: 12px 0 0 auto;
    padding: 4px 12px;
    background: #2a2118;
    color: #f0d060;
    border: 1px solid #c9a227;
    border-radius: 2px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .insight-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 46px;
    height: 46px;
    padding: 0 8px;
    background: #3a2c16;
    border: 1.5px solid #c9a227;
    border-radius: 2px;
    color: #f0d060;
    font-size: 20px;
    font-weight: bold;
    line-height: 1;
  }
  .insight-label {
    color: #f0d060;
    font-size: 15px;
    letter-spacing: 1px;
  }

  .note-tip {
    width: max-content;
    max-width: min(420px, calc(100vw - 24px));
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    pointer-events: auto;
    overflow-wrap: anywhere;
  }

  .load-error {
    margin: 16px;
    padding: 12px;
    background: rgba(58, 24, 20, .9);
    color: #f0a0a0;
    border: 1px solid #8a4038;
    border-radius: 2px;
    font-size: 13px;
    white-space: pre-wrap;
  }

  @media (max-width: 720px) {
    body {
      padding: 12px 10px 24px;
      background-image:
        linear-gradient(rgba(18, 10, 16, .62), rgba(10, 6, 8, .78)),
        url("img/pe_background.jpg");
      background-position: center 18%;
    }
    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .toolbar select,
    .char-picker,
    .char-picker-btn { width: 100%; }
    .stage-head { display: flex; flex-direction: column; }
    .mode-stack {
      order: -1;
      align-self: stretch;
      align-items: center;
      padding: 10px 12px 0;
    }
    .insight-bar { order: 1; min-height: 0; }
    .desc-head { font-size: 18px; }
    .desc-card { font-size: 15px; }
    .parent-label {
      font-size: 13px;
      letter-spacing: 1px;
      padding: 2px 4px;
    }
    .note-tip { font-size: 14px; }
  }
</style>
</head>
