<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Page</title>
</head>
<body>
    <p>将作物种子种植在农田地块或沃姆伍德在任意可种植地块上种植得到作物</p>
    <p>普通种子产生随机的农作物或杂草</p>
    <p>每种农作物都有<notice text="种子、萌芽、小、中、已长成、巨大、腐烂、腐烂巨大">8个生长阶段</notice>，其中前<b>4个</b>阶段的农作物在生长到下一阶段时，都会依照环境条件产生压力数值，压力值决定了作物长成后采收的产出，具体如下：</p>
    <table>
        <tr>
            <th>阶段</th>
            <th>压力值</th>
            <th>产出</th>
        </tr>
        <tr>
            <td>巨大</td>
            <td><b>0-1</b></td>
            <td>巨大作物×1</td>
        </tr>
        <tr>
            <td rowspan="3">已长成</td>
            <td><b>0-6</b></td>
            <td>对应作物×1、对应种子×2</td>
        </tr>
        <tr>
            <td><b>7-11</b></td>
            <td>对应作物×1、对应种子×1</td>
        </tr>
        <tr>
            <td><b>≥12</b></td>
            <td>对应作物×1</td>
        </tr>
    </table>
    <p>当土壤水分不为<b>0</b>时，农作物不会发生自燃</p>
    <p>当半径<b>1.5</b>个地皮范围内有<b>15</b>个及以上的成熟农作物且玩家在其<b>3.75</b>个地皮范围内时，会产生果蝇王</p>
</body>
</html>
