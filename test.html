        <li>韦斯自带-30点保暖值与隔热值</li>

        <li>韦斯有更高的概率被雷劈</li>
        <li>与其他角色相比，猎犬会优先攻击韦斯</li>
        <li>韦斯最喜欢的食物是<notice text="大厨特色菜，只能由<character>沃利</character>制作"><橙黄色？煎饼果子的颜色>鲜果可丽饼</橙黄色？煎饼果子的颜色></notice></li>
