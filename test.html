<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Page</title>
</head>
<body>
    <br><p>无开局起始物品</p><br>
    <h3>胡须</h3>
    <p>威尔逊可以长出胡须，每隔一段时间生长一个阶段，胡须可以提供保暖值和<b>负</b>的隔热值，且可以使用剃刀逐级剃掉并掉落一定数量的胡须，同时回复10点精神值</p>
    <details>
        <summary>胡须生长周期与功效</summary>
        <table>
            <thead>
            <tr>
                <td>天数</td>
                <td>胡子大小</td>
                <td>掉落胡须数量</td>
                <td>保暖值</td>
                <td>隔热值</td>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>4天</td>
                <td>修剪过的</td>
                <td>×1</td>
                <td>15</td>
                <td>-15</td>
            </tr>
            <tr>
                <td>8天</td>
                <td>造型过的的</td>
                <td>×2</td>
                <td>45</td>
                <td>-45</td>
            </tr>
            <tr>    
                <td>16天</td>
                <td>华丽的</td>
                <td>×6</td>
                <td>135</td>
                <td>-135</td>
            </tr>
            </tbody>
        </table>
    </details>
    <p>死亡后胡须长度重置</p>
    <p>最喜欢的食物是<青色>培根煎蛋</青色></p>
</body>
</html>
