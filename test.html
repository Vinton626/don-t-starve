    <h3>特殊能力</h3>
    <p>沃托克斯可以使用灵魂来进行灵魂跳跃，可以释放或吃下来接受灵魂的滋养，恢复一定的饥饿值、生命值与理智值<br>具体效果见下方沃托克斯专属物品:灵魂</p>
    <h3>其他</h3>
    <ul>
        <li>沃托克斯食用食物时，仅能从食物中获得0.5倍的生命值、饥饿值与理智值，不论增减</li>
        <li>沃托克斯受降理智值光环的影响减半</li>
        <li>沃托克斯被视作怪物，因此猪人、兔人与浣猫等生物会主动仇恨他</li>
        <li>沃托克斯最喜欢的食物是<notice text=\"仍会受到食物减效的影响\"><pomegranate>石榴</pomegranate>与<pomegranate>切片熟石榴</pomegranate></notice></li>
    </ul>
